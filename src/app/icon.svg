<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7ff"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background keeps the icon valid as a maskable icon -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Ascending "flow" bars: tracked progress rising over time -->
  <g fill="url(#bar)">
    <rect x="150" y="296" width="44" height="86" rx="22" opacity="0.65"/>
    <rect x="234" y="244" width="44" height="138" rx="22" opacity="0.82"/>
    <rect x="318" y="170" width="44" height="212" rx="22"/>
  </g>
  <!-- Flow line connecting the peaks with a leading node -->
  <path d="M156 286 L256 234 L356 160" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
  <circle cx="356" cy="160" r="22" fill="#ffffff"/>
  <circle cx="356" cy="160" r="11" fill="#06b6d4"/>
</svg>
